<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a1120"/><stop offset="1" stop-color="#111d34"/></linearGradient>
</defs>
<rect width="1440" height="900" fill="#f6f8fb"/>
<rect width="1440" height="500" fill="url(#bg)"/>
<text x="110" y="60" fill="#f8faff" font-family="Arial" font-size="24" font-weight="700">↗ LinkLite</text>
<text x="1110" y="60" fill="#8491ac" font-family="Arial" font-size="12" font-weight="700">URL SHORTENER</text>
<text x="720" y="160" text-anchor="middle" fill="#8295ff" font-family="Arial" font-size="13" font-weight="700">SIMPLE. FAST. PERSISTENT.</text>
<text x="720" y="220" text-anchor="middle" fill="#f8faff" font-family="Arial" font-size="54" font-weight="700">Turn long links into</text>
<text x="720" y="280" text-anchor="middle" fill="#8295ff" font-family="Arial" font-size="54" font-weight="700">short, shareable URLs.</text>
<text x="720" y="320" text-anchor="middle" fill="#aeb8ca" font-family="Arial" font-size="18">Create a short link, share it anywhere, and keep track of every click.</text>
<rect x="300" y="365" width="840" height="72" rx="16" fill="#111a2b" stroke="#29364f"/>
<text x="330" y="410" fill="#66738b" font-family="Arial" font-size="16">🔗  https://example.com/your-long-url</text>
<rect x="1000" y="375" width="125" height="52" rx="11" fill="#6074f1"/>
<text x="1062" y="408" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="700">Shorten URL</text>
<rect x="110" y="465" width="1220" height="100" rx="17" fill="#fff" stroke="#e2e7ef"/>
<text x="145" y="500" fill="#7e899c" font-family="Arial" font-size="12">TOTAL LINKS</text>
<text x="145" y="540" fill="#172033" font-family="Arial" font-size="27" font-weight="700">12</text>
<text x="550" y="500" fill="#7e899c" font-family="Arial" font-size="12">TOTAL CLICKS</text>
<text x="550" y="540" fill="#172033" font-family="Arial" font-size="27" font-weight="700">148</text>
<text x="950" y="500" fill="#7e899c" font-family="Arial" font-size="12">DATABASE</text>
<text x="950" y="540" fill="#172033" font-family="Arial" font-size="27" font-weight="700">PostgreSQL</text>
<text x="110" y="640" fill="#72809a" font-family="Arial" font-size="11" font-weight="700">YOUR LINKS</text>
<text x="110" y="675" fill="#172033" font-family="Arial" font-size="28" font-weight="700">Shortened URLs</text>
<rect x="110" y="700" width="1220" height="80" rx="14" fill="#fff" stroke="#e2e7ef"/>
<text x="140" y="735" fill="#5268df" font-family="Arial" font-size="16" font-weight="700">http://localhost:5000/aB91xK</text>
<text x="140" y="758" fill="#8b95a5" font-family="Arial" font-size="12">https://example.com/a-long-resource</text>
<text x="1020" y="742" fill="#172033" font-family="Arial" font-size="20" font-weight="700">24</text>
<text x="1048" y="742" fill="#8b95a5" font-family="Arial" font-size="11">CLICKS</text>
<rect x="1190" y="720" width="90" height="38" rx="9" fill="#fff" stroke="#dce2eb"/>
