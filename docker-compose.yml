services:
  postgres:
    image: postgres:16-alpine
    container_name: linklite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "5432:5432"
    volumes:
      - shortener_data:/var/lib/postgresql/data

volumes:
  shortener_data:
